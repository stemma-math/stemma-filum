[package]
name = "stemma"
description = "The Stemma client: command line interface, local daemon and group repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "stemma"
path = "src/main.rs"

[lib]
name = "stemma"
path = "src/lib.rs"

[dependencies]
stemma-core.workspace = true

anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
typst = "=0.14.0"
typst-as-lib = { version = "0.15.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts", "typst-html"] }
typst-html = "=0.14.0"
typst-library = "=0.14.0"
typst-svg = "=0.14.0"
ureq.workspace = true
url.workspace = true

[lints]
workspace = true
