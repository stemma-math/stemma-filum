name: Set up the build
description: Rust, Node.js, just, the system libraries the desktop application links against, and the npm dependencies.

inputs:
  lean:
    description: Whether to install elan for the Lean package.
    default: "false"

runs:
  using: composite
  steps:
    - name: System libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential file libayatana-appindicator3-dev librsvg2-dev \
          libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

    - name: Rust
      shell: bash
      # The channel and components come from rust-toolchain.toml.
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        # Checks and release builds compile differently; each keeps its own.
        key: ${{ github.workflow }}-${{ github.job }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          identity/package-lock.json
          stemma-app/frontend/package-lock.json

    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Lean
      if: inputs.lean == 'true'
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: npm dependencies
      shell: bash
      run: just setup
