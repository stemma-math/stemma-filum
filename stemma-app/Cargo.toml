[package]
name = "stemma-app"
description = "The Stemma desktop writing application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "stemma_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "stemma-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
stemma = { path = "../stemma" }
stemma-core.workspace = true
tauri = { version = "2.11", features = [] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[features]
# Whether the frontend is carried inside the binary or asked of a
# development server. Tauri reads this at compile time and the command
# line tool sets it for a release; a release without it opens a window
# with nothing in it, so the build script refuses one.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
