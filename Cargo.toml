[workspace]
resolver = "3"
members = ["stemma", "stemma-core", "stemma-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mariovagomarzal/stemma"
authors = ["Enric Cosme Llópez", "Mario Vago Marzal"]

[workspace.dependencies]
stemma-core = { path = "stemma-core", version = "0.0.0" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
