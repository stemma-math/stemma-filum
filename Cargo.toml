[workspace]
resolver = "3"
members = ["identity", "stemma", "stemma-app", "stemma-core", "stemma-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mariovagomarzal/stemma"
authors = ["Enric Cosme Llópez", "Mario Vago Marzal"]

[workspace.dependencies]
stemma-core = { path = "stemma-core", version = "0.0.0" }
stemma-identity = { path = "identity", version = "0.0.0" }

anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "rustls-native-certs", "rustls-tls", "smtp-transport"] }
maud = { version = "0.27", features = ["axum"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
ulid = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
