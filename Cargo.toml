[workspace]
resolver = "3"
members = ["stemma", "stemma-core", "stemma-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mariovagomarzal/stemma"
authors = ["Enric Cosme Llópez", "Mario Vago Marzal"]

[workspace.dependencies]
stemma-core = { path = "stemma-core", version = "0.0.0" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
ulid = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
